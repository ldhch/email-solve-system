[project]
name = "shouhou-agent-backend"
version = "0.1.0"
description = "After-sales email auto-reply backend (Phase 3: ingest -> classify -> reply + retention + high-risk tickets + KB/QA)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.2",
    "apscheduler>=3.10,<4",
    "cryptography>=42.0",
    "bleach>=6.1",
    "openai>=1.30",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx==0.28.1",
    "anyio==4.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
